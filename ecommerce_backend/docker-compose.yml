services:
  web:
    build: .
    command: gunicorn ecommerce_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DEBUG=1
      - DATABASE_NAME=ecommerce
      - DATABASE_USER=ecommerce_user
      - DATABASE_PASSWORD=yourpassword
      - DATABASE_HOST=db
      - DATABASE_PORT=5432

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: my_postgres
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: Sew76@bayu21
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
